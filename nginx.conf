server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS is enabled by replacing this file with the documented Certbot configuration
# after DNS points at this VM. Keeping the initial configuration HTTP-only lets the
# first deployment and ACME HTTP-01 challenge succeed.
