services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    expose:
      - "8000"

  nginx_proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
